<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa Thiết bị</title>
    <style>
        :root {
            --primary: #3949ab;
            --primary-dark: #283593;
            --blue: #2469d3;
            --blue-hover: #174ead;
            --sidebar-bg: linear-gradient(135deg, #23235a 70%, #5e60ce 100%);
            --radius: 16px;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f6f8fc;
        }
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 225px;
            background: var(--sidebar-bg);
            color: #fff;
            display: flex;
            flex-direction: column;
            padding-top: 38px;
            box-shadow: 2px 0 18px rgba(44,44,80,0.04);
        }
        .sidebar h2 {
            font-size: 28px;
            margin: 0 0 46px 32px;
            font-weight: 800;
            letter-spacing: 2px;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar li {
            padding: 16px 36px;
            font-size: 17px;
            cursor: pointer;
            border-radius: 8px 0 0 8px;
            margin-bottom: 6px;
            transition: background 0.22s, font-weight 0.18s;
        }
        .sidebar li.active, .sidebar li:hover {
            background: #5e60ce;
            font-weight: 600;
            box-shadow: 2px 4px 16px 0 rgba(94,96,206,0.07);
        }
        .sidebar li a {
            color: #fff;
            text-decoration: none;
            width: 100%;
            display: block;
            height: 100%;
        }
        .content {
            flex: 1;
            padding: 44px 54px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 38px;
        }
        .brand {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 1.5px;
        }
        .user-info {
            font-size: 17px;
        }
        .logout-btn {
            background: #fff;
            border: 1px solid var(--primary-dark);
            color: var(--primary-dark);
            border-radius: 6px;
            padding: 7px 18px;
            cursor: pointer;
            font-weight: 500;
            margin-left: 10px;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: #ecebfa;
        }
        .form-section {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: 0 4px 28px rgba(60,70,130,0.12);
            padding: 40px 40px 26px 40px;
            max-width: 570px;
            margin: 0 auto;
        }
        h2 {
            margin-bottom: 25px;
            color: var(--primary);
            letter-spacing: 1px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 21px;
        }
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #283593;
            letter-spacing: 0.3px;
        }
        input, select {
            width: 100%;
            padding: 10px 13px;
            border-radius: 6px;
            border: 1px solid #d1d5e8;
            font-size: 16px;
            background: #f7f9fd;
            margin-top: 3px;
        }
        input:focus, select:focus {
            outline: 1.5px solid var(--primary);
            background: #eef3fd;
        }
        .btn-blue {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 32px;
            border-radius: 7px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.17s, box-shadow 0.18s;
            box-shadow: 0 2px 8px rgba(57,73,171,0.13);
            font-size: 16px;
        }
        .btn-blue:hover {
            background: var(--blue-hover);
        }
        .form-actions {
            margin-top: 28px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .form-actions a {
            text-decoration: none;
            color: #fff;
            background: #bbb;
            border-radius: 6px;
            padding: 9px 28px;
            font-weight: 500;
            transition: background 0.18s, color 0.13s;
        }
        .form-actions a:hover {
            background: #d3d5e5;
            color: #283593;
        }
        /* Preview img */
        .form-group img {
            height: 60px;
            margin-top: 11px;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        @media (max-width: 800px) {
            .content { padding: 15px; }
            .form-section { padding: 22px 6px 14px 6px; }
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <div class="sidebar">
        <h2>SEDO</h2>
        <ul>
            <li><a th:href="@{/admin/dashboard}">Bảng điều khiển</a></li>
            <li class="active">Quản lý Thiết bị Máy tính</li>
            <li><a th:href="@{/admin/orders}">Quản lý Đơn hàng</a></li>
            <li><a th:href="@{/admin/users}">Quản lý Người dùng</a></li>
        </ul>
    </div>
    <div class="content">
        <div class="topbar">
            <div class="brand">Chỉnh sửa Thiết bị</div>
            <div class="user-info">
                Quản trị viên
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="logout-btn">Đăng xuất</button>
                </form>
            </div>
        </div>
        <div class="form-section">
            <h2>Chỉnh sửa Thiết bị</h2>
            <form th:action="@{/admin/computer-devices/edit}" method="post" th:object="${device}">
                <input type="hidden" th:field="*{id}"/>
                <div class="form-group">
                    <label>Tên thiết bị</label>
                    <input th:field="*{name}" required/>
                </div>
                <div class="form-group">
                    <label>Thương hiệu</label>
                    <input th:field="*{brand}" required/>
                </div>
                <div class="form-group">
                    <label>Mẫu mã</label>
                    <input th:field="*{model}" required/>
                </div>
                <div class="form-group">
                    <label>Danh mục</label>
                    <select th:field="*{category.id}" required>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                                th:selected="${cat.id} == ${device.category.id}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mô tả</label>
                    <input th:field="*{description}" required/>
                </div>
                <div class="form-group">
                    <label>Model CPU</label>
                    <input th:field="*{cpuModel}"/>
                </div>
                <div class="form-group">
                    <label>RAM (GB)</label>
                    <input th:field="*{ram}" type="number" min="0"/>
                </div>
                <div class="form-group">
                    <label>Giá</label>
                    <input th:field="*{price}" type="number" step="0.01" min="0" required/>
                </div>
                <div class="form-group">
                    <label>Số lượng tồn kho</label>
                    <input th:field="*{stockQuantity}" type="number" min="0" required/>
                </div>
                <div class="form-group">
                    <label>Thông số kỹ thuật</label>
                    <input th:field="*{specifications}"/>
                </div>
                <div class="form-group">
                    <label>URL hình ảnh</label>
                    <input type="text" name="imageUrl"
                           th:value="${device.computerImages != null and !device.computerImages.isEmpty() ? device.computerImages[0].imageUrl : ''}"
                           placeholder="Dán URL hình ảnh vào đây"/>
                    <div th:if="${imageError}" style="color: #e53935;" th:text="${imageError}"></div>
                    <div th:if="${device.computerImages != null and !device.computerImages.isEmpty()}">
                        <img th:src="@{'/uploads/ComputerDevices/' + ${device.computerImages[0].imageUrl}}" alt="Xem trước hình ảnh">
                    </div>
                </div>
                <div class="form-group">
                    <label>Trạng thái hoạt động</label>
                    <select th:field="*{isActive}">
                        <option th:value="true">Hoạt động</option>
                        <option th:value="false">Không hoạt động</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button class="btn-blue" type="submit">Cập nhật</button>
                    <a th:href="@{/admin/computer-devices}">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
