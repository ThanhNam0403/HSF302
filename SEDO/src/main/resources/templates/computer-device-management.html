<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Thiết bị Máy tính</title>
    <style>
        :root {
            --primary: #3949ab;
            --primary-dark: #283593;
            --blue: #2469d3;
            --blue-hover: #174ead;
            --sidebar-bg: linear-gradient(135deg, #23235a 70%, #5e60ce 100%);
            --radius: 14px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f6f8fc;
        }

        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 225px;
            background: var(--sidebar-bg);
            color: #fff;
            display: flex;
            flex-direction: column;
            padding-top: 38px;
            box-shadow: 2px 0 18px rgba(44, 44, 80, 0.04);
        }

        .sidebar h2 {
            font-size: 28px;
            margin: 0 0 46px 32px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar li {
            padding: 16px 36px;
            font-size: 17px;
            cursor: pointer;
            border-radius: 8px 0 0 8px;
            margin-bottom: 6px;
            transition: background 0.22s, font-weight 0.18s;
        }

        .sidebar li.active, .sidebar li:hover {
            background: #5e60ce;
            font-weight: 600;
            box-shadow: 2px 4px 16px 0 rgba(94, 96, 206, 0.07);
        }

        .sidebar li a {
            color: #fff;
            text-decoration: none;
            width: 100%;
            display: block;
            height: 100%;
        }

        .content {
            flex: 1;
            padding: 44px 54px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 38px;
        }

        .brand {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 1.5px;
        }

        .user-info {
            font-size: 17px;
        }

        .logout-btn {
            background: #fff;
            border: 1px solid var(--primary-dark);
            color: var(--primary-dark);
            border-radius: 6px;
            padding: 7px 18px;
            cursor: pointer;
            font-weight: 500;
            margin-left: 10px;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: #ecebfa;
        }

        .search-row {
            display: flex;
            align-items: center;
            margin-bottom: 28px;
            gap: 16px;
            background: #fff;
            border-radius: 10px;
            padding: 18px 24px;
            box-shadow: 0 2px 10px rgba(52, 70, 150, 0.08);
            width: 680px;
            max-width: 100%;
        }

        .search-row input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #d1d5e8;
            font-size: 16px;
            background: #f7f9fd;
        }

        .btn-blue {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 9px 26px;
            border-radius: 5px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.18s, box-shadow 0.14s;
            box-shadow: 0 2px 8px rgba(57, 73, 171, 0.11);
        }

        .btn-blue:hover {
            background: var(--blue-hover);
        }

        .btn-green {
            color: #24ba4b;
            background: #e7fbe8;
            border: none;
            cursor: pointer;
            font-weight: 600;
            padding: 5px 15px;
            border-radius: 4px;
            transition: background 0.16s, color 0.16s;
        }

        .btn-green:hover {
            background: #c9f5d3;
        }

        .btn-red {
            color: #e53935;
            background: #ffeced;
            border: none;
            cursor: pointer;
            font-weight: 600;
            padding: 5px 15px;
            border-radius: 4px;
            transition: background 0.16s, color 0.16s;
        }

        .btn-red:hover {
            background: #ffd7d9;
        }

        .table-actions button {
            margin-right: 7px;
        }

        .add-btn-container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 16px;
            margin-top: 7px;
        }

        .orders-section {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: 0 2px 14px rgba(60, 70, 130, 0.10);
            padding: 28px 20px 14px 20px;
            margin-top: 16px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th, td {
            padding: 13px 10px;
            text-align: left;
            font-size: 15.5px;
        }

        th {
            color: var(--primary);
            border-bottom: 2px solid #e2e6f2;
            background: #f8faff;
            font-weight: 700;
        }

        tr {
            background: #fff;
            transition: background 0.12s;
        }

        tr:hover {
            background: #f1f6fd;
        }

        td img {
            border-radius: 7px;
            border: 1px solid #e0e0e0;
        }

        .pagination {
            margin-top: 21px;
            text-align: center;
        }

        .pagination a {
            margin: 0 4px;
            padding: 7px 15px;
            text-decoration: none;
            border-radius: 5px;
            color: var(--primary);
            background: #f8faff;
            transition: background 0.17s, color 0.16s;
            font-size: 16px;
        }

        .pagination a.active-page {
            background: var(--primary) !important;
            color: #fff !important;
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .search-row {
                width: 100%;
            }

            table {
                min-width: 720px;
            }
        }

        @media (max-width: 900px) {
            .sidebar {
                display: none;
            }

            .content {
                padding: 22px 4px;
            }

            .search-row {
                padding: 12px 5px;
            }

            table {
                min-width: 400px;
            }
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <div class="sidebar">
        <h2>SEDO</h2>
        <ul>
            <li><a th:href="@{/admin/dashboard}">Bảng điều khiển</a></li>
            <li class="active">Quản lý Thiết bị Máy tính</li>
            <li><a th:href="@{/admin/orders}">Quản lý Đơn hàng</a></li>
            <li><a th:href="@{/admin/users}">Quản lý Người dùng</a></li>
        </ul>
    </div>
    <div class="content">
        <div class="topbar">
            <div class="brand">Quản lý Thiết bị Máy tính</div>
            <div class="user-info">
                Quản trị viên
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="logout-btn">Đăng xuất</button>
                </form>
            </div>
        </div>

        <!-- FORM TÌM KIẾM -->
        <form th:action="@{/admin/computer-devices}" method="get" class="search-row">
            <input type="text" placeholder="Tìm kiếm thiết bị..." name="search" th:value="${search}">
            <button class="btn-blue" type="submit">Tìm kiếm</button>
            <button type="button" class="btn-blue" style="margin-left: 10px;"
                    th:onclick="|window.location='@{/admin/computer-devices}'|">Xóa tìm kiếm
            </button>
        </form>

        <div class="add-btn-container">
            <button class="btn-blue" th:onclick="|window.location='@{/admin/computer-devices/create}'|">+ Thêm thiết bị
            </button>
        </div>

        <div class="orders-section">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>TÊN</th>
                    <th>THƯƠNG HIỆU</th>
                    <th>MẪU MÃ</th>
                    <th>DANH MỤC</th>
                    <th>CPU</th>
                    <th>RAM</th>
                    <th>TỒN KHO</th>
                    <th>GIÁ</th>
                    <th>TRẠNG THÁI</th>
                    <th>HÌNH ẢNH</th>
                    <th>HÀNH ĐỘNG</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="device : ${devicePage.content}">
                    <td th:text="${device.id}"></td>
                    <td th:text="${device.name}"></td>
                    <td th:text="${device.brand}"></td>
                    <td th:text="${device.model}"></td>
                    <td th:text="${device.category.name}"></td>
                    <td th:text="${device.cpuModel}"></td>
                    <td th:text="${device.ram}"></td>
                    <td th:text="${device.stockQuantity}"></td>
                    <td th:text="${#numbers.formatDecimal(device.price, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}"></td>
                    <td>
                        <span th:text="${device.isActive} ? 'Hoạt động' : 'Không hoạt động'"
                              th:style="${device.isActive} ? 'color:#24ba4b; font-weight:700' : 'color:#e53935; font-weight:700'"></span>
                    </td>
                    <td>
                        <img th:if="${device.computerImages != null and !device.computerImages.isEmpty()}"
                             th:src="@{'/uploads/ComputerDevices/' + ${device.computerImages[0].imageUrl}}"
                             alt="hình ảnh" style="height:40px;"/>
                    </td>
                    <td class="table-actions">
                        <button class="btn-green"
                                th:onclick="|window.location='@{/admin/computer-devices/edit/{id}(id=${device.id})}'|">
                            Sửa
                        </button>
                        <button class="btn-red"
                                th:onclick="|if(confirm('Bạn có chắc chắn không?')) window.location='@{/admin/computer-devices/delete/{id}(id=${device.id})}'|">
                            Xóa
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="pagination">
                <!-- Đầu trang -->
                <a th:if="${devicePage.number > 0}"
                   th:href="@{/admin/computer-devices(page=0, search=${search})}">&laquo;&laquo;</a>

                <!-- Trước -->
                <a th:if="${devicePage.number > 0}"
                   th:href="@{/admin/computer-devices(page=${devicePage.number - 1}, search=${search})}">&laquo;
                    Trước</a>

                <!-- Hiển thị 3 trang: trước, hiện tại, sau (nếu có) -->
                <span th:each="i : ${#numbers.sequence(
        (devicePage.number - 1) < 0 ? 0 : devicePage.number - 1,
        (devicePage.number + 1) >= devicePage.totalPages ? devicePage.totalPages - 1 : devicePage.number + 1
    )}">
        <a th:href="@{/admin/computer-devices(page=${i}, search=${search})}"
           th:text="${i + 1}"
           th:classappend="${devicePage.number == i} ? 'active-page' : ''">
        </a>
    </span>

                <!-- Tiếp -->
                <a th:if="${devicePage.number + 1 < devicePage.totalPages}"
                   th:href="@{/admin/computer-devices(page=${devicePage.number + 1}, search=${search})}">Tiếp
                    &raquo;</a>

                <!-- Cuối trang -->
                <a th:if="${devicePage.number + 1 < devicePage.totalPages}"
                   th:href="@{/admin/computer-devices(page=${devicePage.totalPages - 1}, search=${search})}">&raquo;&raquo;</a>
            </div>

        </div>


    </div>
</div>
</body>
</html>
