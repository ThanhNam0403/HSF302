<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử đơn hàng</title>
    <link rel="stylesheet" th:href="@{/orderhistory.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> <!-- Font Awesome -->
</head>
<body>
<div class="container">

    <section class="order-history">
        <h2>📦 Lịch sử đơn hàng</h2>

        <div th:if="${orders != null && !orders.isEmpty()}">
            <table>
                <thead>
                <tr>
                    <th>Mã đơn</th>
                    <th>Ngày đặt</th>
                    <th>Tổng tiền</th>
                    <th>Trạng thái</th>
                    <th>Chi tiết</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.id}"></td>
                    <td th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 2, 'POINT')} + ' đ'"></td>
                    <td th:text="${order.status}"></td>
                    <td>
                        <a th:href="@{'/orders/details/' + ${order.id}}" class="btn">
                            <i class="fa-solid fa-eye"></i> Xem chi tiết
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${orders == null || orders.isEmpty()}">
            <p>Bạn chưa có đơn hàng nào.</p>
        </div>

        <div class="back-home">
            <a th:href="@{/SEDO}" class="btn">
                <i class="fa-solid fa-house"></i><-Quay về trang chủ
            </a>
        </div>
    </section>

</div> <!-- đóng .container -->
</body>

</html>
