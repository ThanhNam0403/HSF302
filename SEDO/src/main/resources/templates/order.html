<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Checkout</title>
    <link rel="stylesheet" th:href="@{/order.css}">
    <link rel="stylesheet" th:href="@{/taskbar.css}">
</head>
<body>
<nav th:replace="fragments/navbar :: navbar"></nav>

<div class="container">
    <h2>Xác nhận đơn hàng</h2>

    <form th:action="@{/orders/confirm}" method="post" autocomplete="off">
        <!-- Địa chỉ giao hàng -->
        <div class="section">
            <h3>Địa chỉ giao hàng</h3>
            <div class="address-box">
                <span th:text="${shippingAddress}">123 Sample St</span>
            </div>
        </div>

        <!-- Thông tin sản phẩm -->
        <div class="section">
            <h3>Thông tin sản phẩm</h3>
            <table>
                <thead>
                <tr>
                    <th>Sản phẩm</th>
                    <th>Số lượng</th>
                    <th>Đơn giá</th>
                    <th>Thành tiền</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cartItems}">
                    <td th:text="${item.computer.name}">Tên sản phẩm</td>
                    <td th:text="${item.quantity}">1</td>
                    <td th:text="${#numbers.formatDecimal(item.priceAtAddToCart, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0.00 VNĐ</td>
                    <td th:text="${#numbers.formatDecimal(item.priceAtAddToCart.multiply(T(java.math.BigDecimal).valueOf(item.quantity.longValue())), 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0.00 VNĐ</td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Tổng kết -->
        <div class="section order-summary">
            <div class="summary-row">
                <span>Thành tiền:</span>
                <span th:text="${#numbers.formatDecimal(cartSubtotal, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0.00 VNĐ</span>
            </div>
            <div class="summary-row">
                <span>Thuế (10%):</span>
                <span th:text="${#numbers.formatDecimal(taxAmount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">$0.00</span>
            </div>
            <div class="summary-row">
                <span>Vận chuyển:</span>
                <span th:text="${shippingCost.compareTo(T(java.math.BigDecimal).ZERO) == 0 ? 'Free' : #numbers.formatDecimal(shippingCost, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}">Miễn phí</span>
            </div>
            <div class="summary-divider"></div>
            <div class="summary-row total">
                <span>Tổng cộng:</span>
                <span th:text="${#numbers.formatDecimal(cartTotal, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0.00 VNĐ</span>
            </div>
        </div>

        <!-- Nút hành động -->
        <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center;">
            <a th:href="@{/cart}" class="back-btn">← Quay lại giỏ hàng</a>
            <button type="submit">Đặt hàng</button>
        </div>

    </form>
</div>
</body>
</html>
