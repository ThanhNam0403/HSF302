<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - SEDO</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" th:href="@{/dashboard.css}">
</head>
<body class="dashboard-body">
    <nav class="dashboard-nav">
        <div class="nav-brand">SEDO Admin</div>
        <div class="nav-user">
            <span th:text="${user.fullName}"></span>
            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="sidebar">
            <div class="user-info">
                <div class="user-avatar">
                    <span th:text="${#strings.substring(user.fullName,0,1)}"></span>
                </div>
                <div class="user-details">
                    <h3 th:text="${user.fullName}"></h3>
                    <p th:text="${user.email}"></p>
                    <span class="role-badge admin" th:text="${user.role.roleName}"></span>
                </div>
            </div>
            <ul class="nav-menu">
                <li class="active"><a href="#"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="#"><i class="fas fa-users"></i> Users</a></li>
                <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
        </div>

        <main class="content">
            <h1>Welcome to Admin Dashboard</h1>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Users</h3>
                    <p class="stat-number">2,345</p>
                </div>
                <div class="stat-card">
                    <h3>Active Users</h3>
                    <p class="stat-number">1,987</p>
                </div>
                <div class="stat-card">
                    <h3>New Today</h3>
                    <p class="stat-number">48</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
