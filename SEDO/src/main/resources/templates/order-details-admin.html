<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết Đơn hàng</title>
    <link rel="stylesheet" th:href="@{/orderdetail.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f7f7fa;
            margin: 0;
        }
        .details-wrapper {
            min-height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .order-card {
            width: 800px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(80,80,130,0.14);
            padding: 36px 40px 30px 40px;
            margin: 42px 0 30px 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            transition: box-shadow .18s;
        }
        .order-card:hover {
            box-shadow: 0 12px 44px rgba(50,50,90,0.19);
        }
        .order-title {
            font-size: 2rem;
            font-weight: bold;
            color: #222249;
            margin-bottom: 18px;
            text-align: center;
            width: 100%;
            letter-spacing: 1.3px;
        }
        .order-info-list {
            width: 100%;
            background: #f6f7fd;
            border-radius: 8px;
            padding: 22px 24px;
            margin-bottom: 22px;
            font-size: 16px;
        }
        .order-info-list p {
            margin: 9px 0;
            font-size: 15.5px;
        }
        .order-info-list strong {
            min-width: 150px;
            display: inline-block;
            color: #4647a3;
        }
        .order-items-title {
            font-size: 1.23rem;
            color: #333353;
            margin: 14px 0 10px 0;
            font-weight: 600;
        }
        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-bottom: 12px;
            background: #fcfcff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(90,90,120,0.05);
        }
        th, td {
            padding: 11px 10px;
            font-size: 15px;
            text-align: left;
        }
        th {
            background: #f2f4fa;
            color: #52527e;
            font-weight: 600;
            border-bottom: 2px solid #e2e2f7;
        }
        tr:not(:last-child) td {
            border-bottom: 1px solid #e6e6f2;
        }
        .back {
            width: 100%;
            margin-top: 18px;
            display: flex;
            justify-content: flex-end;
        }
        .btn {
            color: #fff;
            background: #333353;
            padding: 11px 28px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 10px rgba(51,51,83,0.08);
            transition: background .18s;
        }
        .btn:hover { background: #4b4b8e; }
        @media (max-width: 600px) {
            .order-card { width: 99%; padding: 10px; }
            .table-wrap { font-size: 12px;}
        }
    </style>
</head>
<body>
<div class="details-wrapper">
    <div class="order-card">
        <div class="order-title">
            <i class="fa-solid fa-receipt"></i> Chi tiết Đơn hàng
        </div>

        <div class="order-info-list">
            <p><strong>Mã đơn hàng:</strong> <span th:text="${order.id}"></span></p>
            <p><strong>Ngày đặt hàng:</strong> <span th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy')}"></span></p>
            <p><strong>Trạng thái:</strong> <span th:text="${order.status}"></span></p>
            <p><strong>Tổng tiền:</strong>
                <span th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 2, 'POINT')} + ' đ'"></span>
            </p>
            <p><strong>Khách hàng:</strong> <span th:text="${order.customer.fullName}"></span></p>
            <p><strong>Địa chỉ giao hàng:</strong> <span th:text="${order.shippingAddress}"></span></p>
            <p><strong>Phương thức thanh toán:</strong> <span th:text="${order.paymentMethod}"></span></p>
        </div>

        <div class="order-items-title">Các mặt hàng trong đơn</div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Tên sản phẩm</th>
                    <th>Đơn giá</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${orderDetails}">
                    <td th:text="${item.computer.name}"></td>
                    <td th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 2, 'POINT')} + ' đ'"></td>
                    <td th:text="${item.quantity}"></td>
                    <td th:text="${#numbers.formatDecimal(item.unitPrice * item.quantity, 0, 'COMMA', 2, 'POINT')} + ' đ'"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="back">
            <a th:href="@{/admin/orders}" class="btn">
                <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách đơn hàng
            </a>
        </div>
    </div>
</div>
</body>
</html>
