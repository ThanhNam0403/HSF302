<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - SEDO</title>
    <link rel="stylesheet" th:href="@{/register.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>

    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-user-plus"></i>
            </div>
            <h1>Tạo tài khoản</h1>
            <p>Tham gia SEDO ngay hôm nay</p>
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post" class="login-form">

            <!-- Hiển thị thông báo thành công -->
            <div th:if="${success}" class="alert alert-success">
                <i class="fas fa-check-circle"></i>
                <span th:text="${success}"></span>
            </div>

            <!-- Hiển thị lỗi từ controller -->
            <div th:if="${error}" class="alert alert-error">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}"></span>
            </div>

            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" th:field="*{username}">
                <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error-msg"></p>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-msg"></p>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <div class="input-wrapper">
                    <input type="password" id="password" th:field="*{password}"
                           oninput="toggleEyeIcon(this)">
                    <i class="fas fa-eye toggle-password" onclick="togglePassword()" style="display: none;"></i>
                </div>
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-msg"></p>
            </div>

            <div class="form-group">
                <label for="fullName">Họ và tên</label>
                <input type="text" id="fullName" th:field="*{fullName}">
                <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="error-msg"></p>
            </div>

            <div class="form-group">
                <label for="phoneNumber">Số điện thoại</label>
                <input type="tel" id="phoneNumber" th:field="*{phoneNumber}">
                <p th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="error-msg"></p>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ</label>
                <input type="text" id="address" th:field="*{address}">
                <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="error-msg"></p>
            </div>

            <button type="submit" class="login-btn">
                <i class="fas fa-user-plus"></i> Đăng ký
            </button>
        </form>

        <div class="register-section">
            <p>Đã có tài khoản? <a th:href="@{/login}" class="register-link">Đăng nhập tại đây</a></p>
        </div>
    </div>
</div>

<script th:inline="javascript">
    function togglePassword() {
        const passwordInput = document.getElementById("password");
        const toggleIcon = document.querySelector(".toggle-password");
        const isPassword = passwordInput.getAttribute("type") === "password";

        passwordInput.setAttribute("type", isPassword ? "text" : "password");
        toggleIcon.classList.toggle("fa-eye");
        toggleIcon.classList.toggle("fa-eye-slash");
    }

    function toggleEyeIcon(input) {
        const toggleIcon = document.querySelector(".toggle-password");
        toggleIcon.style.display = input.value.length > 0 ? "block" : "none";
    }
</script>
</body>
</html>
