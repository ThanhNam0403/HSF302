<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo Người dùng</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f7fa;
        }
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: linear-gradient(135deg, #30305d 60%, #4b4b8e 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            padding-top: 36px;
            box-shadow: 2px 0 10px rgba(44,44,66,0.04);
        }
        .sidebar h2 {
            font-size: 26px;
            margin: 0 0 45px 32px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar li {
            padding: 16px 36px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.22s;
            border-radius: 6px 0 0 6px;
            margin-bottom: 5px;
        }
        .sidebar li.active, .sidebar li:hover {
            background: #5757b9;
            font-weight: 600;
            box-shadow: 2px 4px 14px 0 rgba(80,80,180,0.04);
        }
        .sidebar li a {
            color: #fff;
            text-decoration: none;
            display: block;
            width: 100%;
            height: 100%;
            transition: color 0.18s;
        }
        .content {
            flex: 1;
            padding: 42px 54px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 38px;
        }
        .brand {
            font-size: 32px;
            font-weight: bold;
            color: #353575;
            letter-spacing: 1.5px;
        }
        .user-info {
            font-size: 16px;
        }
        .logout-btn {
            background: #fff;
            border: 1px solid #333353;
            color: #333353;
            border-radius: 6px;
            padding: 7px 18px;
            cursor: pointer;
            font-weight: 500;
            margin-left: 10px;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: #e8eaf6;
        }
        .form-section {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(60,70,130,0.10);
            padding: 38px 32px 28px 32px;
            max-width: 540px;
            margin: 0 auto;
        }
        h2 {
            margin-bottom: 22px;
            color: #353575;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 500;
            color: #222246;
            letter-spacing: 0.4px;
        }
        input, select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 5px;
            border: 1px solid #d1d5e8;
            font-size: 16px;
            background: #f7f9fd;
            transition: border-color 0.17s;
        }
        input:focus, select:focus {
            border-color: #2469d3;
            outline: none;
        }
        .btn-blue {
            background: #2469d3;
            color: #fff;
            border: none;
            padding: 10px 28px;
            border-radius: 5px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.17s, box-shadow 0.18s;
            box-shadow: 0 2px 6px rgba(36, 105, 211, 0.08);
        }
        .btn-blue:hover {
            background: #174ead;
        }
        .form-actions {
            margin-top: 26px;
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .form-actions a {
            background: #f3f4f9;
            color: #2469d3;
            border-radius: 5px;
            padding: 8px 22px;
            text-decoration: none;
            font-weight: 500;
            border: 1px solid #e2e6f2;
            transition: background 0.16s, color 0.15s;
        }
        .form-actions a:hover {
            background: #e5e8fa;
            color: #174ead;
        }
        .alert {
            padding: 13px 20px;
            border-radius: 7px;
            margin-bottom: 22px;
            font-weight: 500;
        }
        .alert.error { color: #fff; background: #e74c3c; }
        .alert.success { color: #fff; background: #27ae60; }
        @media (max-width: 700px) {
            .content { padding: 12px; }
            .form-section { padding: 18px 6px 20px 6px; }
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <div class="sidebar">
        <h2>SEDO</h2>
        <ul>
            <li><a th:href="@{/admin/dashboard}">Bảng điều khiển</a></li>
            <li><a th:href="@{/admin/products}">Quản lý Sản phẩm</a></li>
            <li><a th:href="@{/admin/orders}">Quản lý Đơn hàng</a></li>
            <li class="active">Quản lý Người dùng</li>
        </ul>
    </div>
    <div class="content">
        <div class="topbar">
            <div class="brand">Tạo Người dùng</div>
            <div class="user-info">
                Quản trị viên
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="logout-btn">Đăng xuất</button>
                </form>
            </div>
        </div>
        <div class="form-section">

            <div th:if="${error}" class="alert error">
                <span th:text="${error}"></span>
            </div>
            <div th:if="${success}" class="alert success">
                <span th:text="${success}"></span>
            </div>

            <h2>Tạo Người dùng mới</h2>
            <form th:action="@{/admin/users/create}" method="post" th:object="${user}">
                <div class="form-group">
                    <label>Họ và tên</label>
                    <input th:field="*{fullName}" required/>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input th:field="*{email}" type="email" required/>
                </div>
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input th:field="*{username}" required/>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input th:field="*{password}" type="password" required/>
                </div>
                <div class="form-group">
                    <label>Vai trò</label>
                    <select th:field="*{role.id}" required>
                        <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.roleName}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input th:field="*{phoneNumber}" />
                </div>
                <div class="form-group">
                    <label>Địa chỉ</label>
                    <input th:field="*{address}" />
                </div>
                <div class="form-actions">
                    <button class="btn-blue" type="submit">Tạo mới</button>
                    <a th:href="@{/admin/users}">Quay lại</a>
                </div>
            </form>

        </div>
    </div>
</div>
</body>
</html>
