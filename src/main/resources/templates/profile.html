<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hồ sơ cá nhân - SEDO</title>
    <link rel="stylesheet" th:href="@{/taskbar.css}">
    <link rel="stylesheet" th:href="@{/profile.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="profile-container">
    <div class="profile-header">
        <div class="profile-avatar-container">
            <img th:if="${user.profileImage}"
                 th:src="@{${user.profileImage}}"
                 alt="Ảnh đại diện"
                 class="profile-avatar"
                 onerror="this.onerror=null; this.src='/images/default-avatar.png';">
            <div th:unless="${user.profileImage}" class="default-avatar">
                <span th:text="${#strings.substring(user.fullName,0,1)}"></span>
            </div>
            <div class="avatar-overlay">
                <label for="profileImage" class="change-avatar-btn">Đổi ảnh</label>
                <input type="file" id="profileImage" accept="image/*" style="display: none;">
            </div>
        </div>
        <h2 th:text="${user.fullName}"></h2>
    </div>

    <form th:action="@{/profile/update}" method="post" class="profile-form">
        <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" name="username" th:value="${user.username}" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" th:value="${user.email}" required>
        </div>

        <div class="form-group">
            <label for="fullName">Họ và tên</label>
            <input type="text" id="fullName" name="fullName" th:value="${user.fullName}" required>
        </div>

        <div class="form-group">
            <label for="phoneNumber">Số điện thoại</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" th:value="${user.phoneNumber}" required>
        </div>

        <div class="form-group">
            <label for="address">Địa chỉ</label>
            <input type="text" id="address" name="address" th:value="${user.address}" required>
        </div>

        <div class="form-group">
            <label for="currentPassword">Mật khẩu hiện tại</label>
            <div class="password-input">
                <input type="password" id="currentPassword" name="currentPassword">
                <i class="fas fa-eye toggle-password"></i>
            </div>
        </div>

        <div class="form-group">
            <label for="newPassword">Mật khẩu mới</label>
            <div class="password-input">
                <input type="password" id="newPassword" name="newPassword">
                <i class="fas fa-eye toggle-password"></i>
            </div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Xác nhận mật khẩu mới</label>
            <div class="password-input">
                <input type="password" id="confirmPassword" name="confirmPassword">
                <i class="fas fa-eye toggle-password"></i>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <button type="submit" class="save-btn">Lưu thay đổi</button>
    </form>
</div>

<script th:inline="javascript">
    // Xử lý tải ảnh đại diện
    document.getElementById('profileImage').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const formData = new FormData();
            formData.append('image', file);

            fetch('/profile/upload-image', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        location.reload();
                    }
                });
        }
    });

    // Hiển thị/ẩn mật khẩu
    document.querySelectorAll('.toggle-password').forEach(icon => {
        icon.addEventListener('click', function() {
            const input = this.previousElementSibling;
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    });
</script>
</body>
</html>
